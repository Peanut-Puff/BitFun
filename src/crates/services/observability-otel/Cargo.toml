[package]
name = "bitfun-observability-otel"
version = "0.2.13"
authors = ["BitFun Team"]
edition = "2021"
description = "Concrete OpenTelemetry and OTLP runtime for BitFun"

[dependencies]
bitfun-observability = { path = "../../execution/observability" }
async-trait = "0.1.89"
fs2 = "0.4"
hex = "0.4"
hmac = "0.12"
log = "0.4"
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
    "trace",
    "metrics",
    "logs",
    "http-proto",
    "reqwest-blocking-client",
    "grpc-tonic",
    "gzip-http",
    "gzip-tonic",
    "tls-ring",
    "tls-roots",
] }
opentelemetry-http = { version = "0.32.0", default-features = false, features = ["reqwest-blocking"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2"
tonic = { version = "0.14", default-features = false }
url = "2"
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
axum = "0.8"
flate2 = "1.0"
opentelemetry-proto = { version = "0.32.0", default-features = false, features = ["gen-tonic", "trace", "metrics", "logs"] }
prost = "0.14"
tempfile = "3"
tokio = { version = "1.52", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "router"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unexpected_cfgs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
